<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Radiant Stop Highway Gradient -->
    <linearGradient id="stopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Diagonal Sheen Highlight -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Glow Layer -->
  <polygon 
    points="37.5,8 90.5,8 120,37.5 120,90.5 90.5,120 37.5,120 8,90.5 8,37.5" 
    fill="#dc2626" 
    filter="url(#auraGlow)"
  />

  <!-- Outer White Highway Border -->
  <polygon 
    points="37.5,8 90.5,8 120,37.5 120,90.5 90.5,120 37.5,120 8,90.5 8,37.5" 
    fill="#ffffff"
  />

  <!-- Main Red Sign Plate -->
  <polygon 
    points="39,12 89,12 116,39 116,89 89,116 39,116 12,89 12,39" 
    fill="url(#stopGrad)"
  />

  <!-- Inner White Octagon Pinstripe Line -->
  <polygon 
    points="41,18 87,18 110,41 110,87 87,110 41,110 18,41 18,41" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="2.5" 
    stroke-opacity="0.9"
  />

  <!-- Diagonal Glass Sheen Reflection -->
  <path 
    d="M 39,12 L 89,12 L 116,39 L 64,80 L 12,39 Z" 
    fill="url(#sheen)" 
  />

  <!-- Mounting Rivets -->
  <circle cx="64" cy="22" r="2" fill="#e2e8f0" stroke="#475569" stroke-width="0.8" />
  <circle cx="64" cy="106" r="2" fill="#e2e8f0" stroke="#475569" stroke-width="0.8" />

  <!-- Bold Highway STOP Typography -->
  <text 
    x="64" 
    y="74" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, 'Arial Black', sans-serif" 
    font-size="30" 
    font-weight="900" 
    text-anchor="middle" 
    letter-spacing="2"
    style="text-shadow: 0 2px 4px rgba(0,0,0,0.4);"
  >
    STOP
  </text>
</svg>
